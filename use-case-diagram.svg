<svg width="680" height="580" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>Use case diagram for the Digital Campus Library Reservation Gateway</title>
<desc>Student Member and Head Librarian actors connected to five use cases inside the system boundary, with an include relationship from Place Hold Request to Authenticate, and an extend relationship from Cancel Hold Request to Place Hold Request.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="150" y="20" width="410" height="500" rx="12" fill="#ffffff" stroke="#888888" stroke-width="1" stroke-dasharray="4 3"/>
<text x="165" y="42" font-size="13" fill="#333333">Library Reservation Gateway</text>

<line x1="80" y1="215" x2="170" y2="80" stroke="#333333" stroke-width="1"/>
<line x1="80" y1="215" x2="170" y2="170" stroke="#333333" stroke-width="1"/>
<line x1="80" y1="215" x2="170" y2="260" stroke="#333333" stroke-width="1"/>
<line x1="80" y1="215" x2="170" y2="350" stroke="#333333" stroke-width="1"/>
<line x1="370" y1="440" x2="580" y2="440" stroke="#333333" stroke-width="1"/>

<ellipse cx="270" cy="80" rx="100" ry="27" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="270" y="84" font-size="14" fill="#0C447C" text-anchor="middle">Search catalog</text>

<ellipse cx="270" cy="170" rx="100" ry="27" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="270" y="174" font-size="14" fill="#0C447C" text-anchor="middle">Place hold request</text>

<ellipse cx="270" cy="260" rx="100" ry="27" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="270" y="264" font-size="14" fill="#0C447C" text-anchor="middle">Cancel hold request</text>

<ellipse cx="270" cy="350" rx="100" ry="27" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="270" y="354" font-size="14" fill="#0C447C" text-anchor="middle">Renew loan</text>

<ellipse cx="270" cy="440" rx="100" ry="27" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="270" y="444" font-size="14" fill="#085041" text-anchor="middle">Manage hold queue</text>

<ellipse cx="470" cy="170" rx="72" ry="27" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="470" y="174" font-size="14" fill="#3C3489" text-anchor="middle">Authenticate</text>

<line x1="370" y1="170" x2="392" y2="170" stroke="#333333" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="380" y="155" font-size="12" fill="#333333" text-anchor="middle">&#171;include&#187;</text>

<line x1="270" y1="233" x2="270" y2="203" stroke="#333333" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="286" y="220" font-size="12" fill="#333333">&#171;extend&#187;</text>

<circle cx="80" cy="184" r="9" fill="none" stroke="#333333" stroke-width="1.5"/>
<line x1="80" y1="193" x2="80" y2="224" stroke="#333333" stroke-width="1.5"/>
<line x1="68" y1="204" x2="92" y2="204" stroke="#333333" stroke-width="1.5"/>
<line x1="80" y1="224" x2="68" y2="249" stroke="#333333" stroke-width="1.5"/>
<line x1="80" y1="224" x2="92" y2="249" stroke="#333333" stroke-width="1.5"/>
<text x="80" y="270" font-size="14" fill="#333333" text-anchor="middle">Student member</text>

<circle cx="580" cy="409" r="9" fill="none" stroke="#333333" stroke-width="1.5"/>
<line x1="580" y1="418" x2="580" y2="449" stroke="#333333" stroke-width="1.5"/>
<line x1="568" y1="429" x2="592" y2="429" stroke="#333333" stroke-width="1.5"/>
<line x1="580" y1="449" x2="568" y2="474" stroke="#333333" stroke-width="1.5"/>
<line x1="580" y1="449" x2="592" y2="474" stroke="#333333" stroke-width="1.5"/>
<text x="580" y="495" font-size="14" fill="#333333" text-anchor="middle">Head librarian</text>
</svg>
